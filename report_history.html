<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1b2d">

<title>NeuroGuardian AI — Report History</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#eef1f4;
    color:#17202b;
}

/* ================= TOPBAR ================= */

.topbar{
    background:linear-gradient(135deg,#101b2d,#1d3350);
    color:white;
    padding:22px 28px;
    padding-top:calc(22px + env(safe-area-inset-top));
}

.topbar-inner{
    max-width:1100px;
    margin:0 auto;
    display:flex;
    align-items:center;
    gap:16px;
}

.back-btn{
    width:46px;
    height:46px;
    border:none;
    border-radius:10px;
    background:rgba(255,255,255,.12);
    color:white;
    font-size:22px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    flex-shrink:0;
}

.back-btn:hover{
    background:rgba(255,255,255,.22);
}

.topbar h1{
    font-size:23px;
}

.topbar p{
    color:#aab7c8;
    font-size:12.5px;
    margin-top:3px;
}

/* ================= MAIN ================= */

.main{
    max-width:1100px;
    margin:0 auto;
    padding:26px 28px 60px;
}

/* ================= SUMMARY STRIP ================= */

.summary-strip{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    margin-bottom:22px;
}

.summary-box{
    background:white;
    border:1px solid #e2e8f0;
    border-radius:14px;
    padding:16px 18px;
}

.summary-box .num{
    font-size:26px;
    font-weight:bold;
    color:#101b2d;
}

.summary-box .lbl{
    font-size:11.5px;
    color:#64748b;
    margin-top:3px;
    text-transform:uppercase;
    letter-spacing:.3px;
}

.summary-box.green .num{ color:#2f7d4f; }
.summary-box.yellow .num{ color:#c98a1d; }
.summary-box.red .num{ color:#c0392b; }

/* ================= CONTROLS ================= */

.controls{
    display:flex;
    gap:12px;
    margin-bottom:18px;
    flex-wrap:wrap;
    align-items:center;
}

.search-box{
    flex:1;
    min-width:220px;
    position:relative;
}

.search-box input{
    width:100%;
    padding:12px 14px 12px 40px;
    border:1px solid #e2e8f0;
    border-radius:11px;
    font-size:14px;
    font-family:inherit;
    background:white;
}

.search-box input:focus{
    outline:none;
    border-color:#35708a;
}

.search-icon{
    position:absolute;
    left:13px;
    top:50%;
    transform:translateY(-50%);
    color:#94a3b8;
    font-size:15px;
}

.sort-select{
    padding:12px 14px;
    border:1px solid #e2e8f0;
    border-radius:11px;
    font-size:13.5px;
    font-family:inherit;
    background:white;
    color:#334155;
    cursor:pointer;
}

/* ================= FILTER TABS ================= */

.filter-tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:6px;
    margin-bottom:20px;
}

.filter-tab{
    border:1px solid #e2e8f0;
    background:white;
    color:#475569;
    padding:9px 16px;
    border-radius:100px;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
    white-space:nowrap;
    flex-shrink:0;
    font-family:inherit;
}

.filter-tab:hover{
    border-color:#35708a;
}

.filter-tab.active{
    background:#101b2d;
    border-color:#101b2d;
    color:white;
}

.filter-tab .count{
    opacity:.65;
    margin-left:4px;
}

/* ================= TIMELINE LIST ================= */

.timeline{
    position:relative;
}

.timeline::before{
    content:"";
    position:absolute;
    left:21px;
    top:8px;
    bottom:8px;
    width:2px;
    background:#e2e8f0;
}

.report-item{
    position:relative;
    padding-left:56px;
    margin-bottom:16px;
}

.report-dot{
    position:absolute;
    left:12px;
    top:18px;
    width:20px;
    height:20px;
    border-radius:50%;
    border:3px solid white;
    box-shadow:0 0 0 2px #e2e8f0;
    z-index:1;
}

.report-dot.green{ background:#2f7d4f; }
.report-dot.yellow{ background:#c98a1d; }
.report-dot.red{ background:#c0392b; }
.report-dot.neutral{ background:#94a3b8; }

.report-card{
    background:white;
    border:1px solid #e2e8f0;
    border-radius:16px;
    padding:18px 20px;
    cursor:pointer;
    transition:.15s;
}

.report-card:hover{
    border-color:#35708a;
    box-shadow:0 8px 20px rgba(16,27,45,.07);
}

.report-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    flex-wrap:wrap;
}

.report-title-row{
    display:flex;
    align-items:center;
    gap:10px;
}

.report-icon{
    width:38px;
    height:38px;
    border-radius:10px;
    background:#eaf3f6;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    flex-shrink:0;
}

.report-title{
    font-size:15.5px;
    font-weight:bold;
    color:#101b2d;
}

.report-date{
    font-size:11.5px;
    color:#94a3b8;
    margin-top:2px;
}

.status-pill{
    padding:6px 12px;
    border-radius:100px;
    font-size:11.5px;
    font-weight:bold;
    white-space:nowrap;
    flex-shrink:0;
}

.status-pill.green{ background:#eafaf0; color:#2f7d4f; }
.status-pill.yellow{ background:#fbf0dc; color:#c98a1d; }
.status-pill.red{ background:#fdeceb; color:#c0392b; }
.status-pill.neutral{ background:#f1f5f9; color:#64748b; }

.report-summary{
    margin-top:12px;
    font-size:13.5px;
    color:#475569;
    line-height:1.6;
}

.report-foot{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:14px;
    padding-top:12px;
    border-top:1px solid #f1f5f9;
}

.module-tag{
    font-size:11px;
    color:#35708a;
    font-weight:bold;
    background:#eaf3f6;
    padding:4px 10px;
    border-radius:100px;
}

.view-link{
    font-size:12.5px;
    color:#35708a;
    font-weight:bold;
    text-decoration:none;
}

/* ================= EMPTY STATE ================= */

.empty-state{
    text-align:center;
    padding:60px 20px;
    color:#64748b;
}

.empty-state .icon{
    font-size:46px;
    margin-bottom:14px;
}

.empty-state h4{
    color:#101b2d;
    margin-bottom:6px;
}

.empty-state p{
    font-size:13.5px;
    max-width:360px;
    margin:0 auto;
}

/* ================= DETAIL MODAL ================= */

.modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(15,20,30,.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
}

.modal-overlay.show{
    display:flex;
}

.modal{
    background:white;
    border-radius:18px;
    max-width:460px;
    width:100%;
    max-height:85vh;
    overflow-y:auto;
    padding:26px;
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:14px;
}

.modal-close{
    border:none;
    background:#f1f5f9;
    width:32px;
    height:32px;
    border-radius:50%;
    font-size:15px;
    cursor:pointer;
    color:#475569;
    flex-shrink:0;
}

.modal h3{
    color:#101b2d;
    margin-bottom:4px;
}

.modal .modal-date{
    font-size:12px;
    color:#94a3b8;
}

.modal-detail-row{
    display:flex;
    justify-content:space-between;
    gap:12px;
    padding:10px 0;
    border-bottom:1px solid #f1f5f9;
    font-size:13.5px;
}

.modal-detail-row b{
    color:#101b2d;
    text-align:right;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

    .summary-strip{
        grid-template-columns:repeat(2,1fr);
    }

    .topbar{
        padding:16px;
        padding-top:calc(16px + env(safe-area-inset-top));
    }

    .main{
        padding:18px 16px 50px;
    }

    .report-head{
        flex-direction:column;
    }

    .timeline::before{
        left:17px;
    }

    .report-item{
        padding-left:46px;
    }

    .report-dot{
        left:8px;
    }

}

</style>

<!-- DATABASE / SESSION CORE -->
<script src="ng-core.js"></script>

</head>


<body>


<!-- =====================================================
     TOPBAR
===================================================== -->

<div class="topbar">

    <div class="topbar-inner">

        <a href="Dashboard.html"
           class="back-btn"
           title="Back to Dashboard"
           aria-label="Back to Dashboard">
            ←
        </a>

        <div>
            <h1>Report History</h1>
            <p>All your screenings in one place</p>
        </div>

    </div>

</div>



<div class="main">


<!-- =====================================================
     SUMMARY STRIP
===================================================== -->

<div class="summary-strip" id="summaryStrip"></div>


<!-- =====================================================
     CONTROLS
===================================================== -->

<div class="controls">

    <div class="search-box">

        <span class="search-icon">🔍</span>

        <input
            type="text"
            id="searchInput"
            placeholder="Search reports..."
            oninput="renderReports()"
            onkeydown="handleSearchKey(event)"
        >

    </div>

    <select
        class="sort-select"
        id="sortSelect"
        onchange="renderReports()"
    >

        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="priority">Priority (Red first)</option>

    </select>

</div>


<!-- =====================================================
     FILTER TABS
===================================================== -->

<div class="filter-tabs" id="filterTabs"></div>


<!-- =====================================================
     TIMELINE
===================================================== -->

<div class="timeline" id="timelineList"></div>


</div>



<!-- =====================================================
     DETAIL MODAL
===================================================== -->

<div
    class="modal-overlay"
    id="modalOverlay"
    onclick="closeModalOnOverlay(event)"
>

    <div class="modal">

        <div class="modal-head">

            <div>

                <h3 id="modalTitle"></h3>

                <div
                    class="modal-date"
                    id="modalDate"
                ></div>

            </div>

            <button
                class="modal-close"
                onclick="closeModal()"
            >
                ✕
            </button>

        </div>

        <div id="modalBody"></div>

    </div>

</div>



<script>

/* =====================================================
   MODULE CONFIG
===================================================== */

const MODULES = {

    blood: {
        label:"Blood Report",
        icon:"🩸",
        page:"blood_report.html"
    },

    brain: {
        label:"Brain Disease Detection",
        icon:"🧠",
        page:"brain_disease.html"
    },

    ctmri: {
        label:"CT / MRI Reports",
        icon:"🩻",
        page:"ct_mri.html"
    },

    migraine: {
        label:"Migraine Analysis",
        icon:"🤕",
        page:"migraine_analysis.html"
    },

    vision: {
        label:"Vision Test",
        icon:"👁️",
        page:"vision.html"
    },

    eyescan: {
        label:"Eye Scanning",
        icon:"📷",
        page:"eye_neuro_screening.html"
    },

    ai_chat: {
        label:"AI Health Assistant",
        icon:"🤖",
        page:"ai_chat.html"
    }

};


/* =====================================================
   API CONFIG
===================================================== */

const API_BASE =
    window.location.protocol === "file:"
        ? "http://127.0.0.1:5000"
        : "";


/* =====================================================
   GLOBAL DATA
===================================================== */

let allReports = [];

let activeFilter = "all";

let databaseLoaded = false;


/* =====================================================
   LOAD REPORTS FROM FLASK DATABASE
===================================================== */

async function loadReportsFromDatabase(){

    const container =
        document.getElementById("timelineList");

    try{

        /* ---------------------------------------------
           GET CURRENT LOGGED-IN USER
        --------------------------------------------- */

        const session =
            window.NG &&
            typeof NG.getSession === "function"
                ? NG.getSession()
                : null;


        if(
            !session ||
            !session.email
        ){

            console.warn(
                "No logged-in user session found."
            );

            allReports = [];

            databaseLoaded = true;

            renderReports();

            return;
        }


        /* ---------------------------------------------
           FETCH USER REPORTS
        --------------------------------------------- */

        const response =
            await fetch(
                API_BASE +
                "/api/reports?email=" +
                encodeURIComponent(session.email)
            );


        let data = null;

        try{

            data =
                await response.json();

        }
        catch(jsonError){

            console.error(
                "Invalid server response:",
                jsonError
            );

            data = null;

        }


        /* ---------------------------------------------
           SERVER ERROR
        --------------------------------------------- */

        if(
            !response.ok ||
            !data ||
            !data.success
        ){

            console.error(
                "Report History database error:",
                data
            );

            allReports = [];

            databaseLoaded = true;

            renderReports();

            return;
        }


        /* ---------------------------------------------
           STORE DATABASE REPORTS
        --------------------------------------------- */

        allReports =
            Array.isArray(data.reports)
                ? data.reports
                : [];


        databaseLoaded = true;


        console.log(
            "✓ Reports loaded from database:",
            allReports.length
        );


        renderReports();


    }
    catch(error){

        console.error(
            "Report History database error:",
            error
        );

        allReports = [];

        databaseLoaded = true;

        renderReports();

    }

}


/* =====================================================
   SUMMARY STRIP
===================================================== */

function renderSummary(){

    const total =
        allReports.length;

    const green =
        allReports.filter(
            r => r.tier === "green"
        ).length;

    const yellow =
        allReports.filter(
            r => r.tier === "yellow"
        ).length;

    const red =
        allReports.filter(
            r => r.tier === "red"
        ).length;


    document.getElementById(
        "summaryStrip"
    ).innerHTML = `

        <div class="summary-box">

            <div class="num">
                ${total}
            </div>

            <div class="lbl">
                Total Reports
            </div>

        </div>


        <div class="summary-box green">

            <div class="num">
                ${green}
            </div>

            <div class="lbl">
                Home Monitoring
            </div>

        </div>


        <div class="summary-box yellow">

            <div class="num">
                ${yellow}
            </div>

            <div class="lbl">
                Doctor Advised
            </div>

        </div>


        <div class="summary-box red">

            <div class="num">
                ${red}
            </div>

            <div class="lbl">
                Emergency Flags
            </div>

        </div>

    `;

}


/* =====================================================
   FILTER TABS
===================================================== */

function renderFilterTabs(){

    const counts = {};


    Object.keys(MODULES).forEach(
        key => {

            counts[key] =
                allReports.filter(
                    r => r.module === key
                ).length;

        }
    );


    let html = `

        <button
            class="filter-tab ${activeFilter === "all" ? "active" : ""}"
            onclick="setFilter('all')"
        >

            All

            <span class="count">
                ${allReports.length}
            </span>

        </button>

    `;


    Object.keys(MODULES).forEach(
        key => {

            if(counts[key] > 0){

                html += `

                    <button
                        class="filter-tab ${activeFilter === key ? "active" : ""}"
                        onclick="setFilter('${key}')"
                    >

                        ${MODULES[key].icon}

                        ${MODULES[key].label}

                        <span class="count">
                            ${counts[key]}
                        </span>

                    </button>

                `;

            }

        }
    );


    document.getElementById(
        "filterTabs"
    ).innerHTML = html;

}


function setFilter(key){

    activeFilter = key;

    renderReports();

}


/* =====================================================
   SEARCH
   Enter key is also supported
===================================================== */

function handleSearchKey(event){

    if(event.key === "Enter"){

        event.preventDefault();

        renderReports();

    }

}


/* =====================================================
   ESCAPE HTML
   Prevent report data from breaking the UI
===================================================== */

function escapeHtml(value){

    if(value === null || value === undefined){

        return "";

    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   FORMAT DETAIL VALUES
===================================================== */

function formatDetailValue(value){

    if(value === null || value === undefined){

        return "";

    }


    if(typeof value === "object"){

        try{

            return JSON.stringify(value);

        }
        catch(e){

            return String(value);

        }

    }


    return String(value);

}


/* =====================================================
   MAIN RENDER
===================================================== */

function renderReports(){

    renderSummary();

    renderFilterTabs();


    const searchInput =
        document.getElementById(
            "searchInput"
        );


    const sortInput =
        document.getElementById(
            "sortSelect"
        );


    const search =
        searchInput
            ? searchInput.value
                .trim()
                .toLowerCase()
            : "";


    const sortBy =
        sortInput
            ? sortInput.value
            : "newest";


    let list =
        allReports.slice();


    /* ---------------------------------------------
       MODULE FILTER
    --------------------------------------------- */

    if(activeFilter !== "all"){

        list =
            list.filter(
                r =>
                    r.module === activeFilter
            );

    }


    /* ---------------------------------------------
       SEARCH
    --------------------------------------------- */

    if(search){

        list =
            list.filter(r => {

                const title =
                    String(
                        r.title || ""
                    ).toLowerCase();


                const summary =
                    String(
                        r.summary || ""
                    ).toLowerCase();


                const module =
                    String(
                        r.module || ""
                    ).toLowerCase();


                let detailsText = "";

                try{

                    detailsText =
                        JSON.stringify(
                            r.details || {}
                        ).toLowerCase();

                }
                catch(e){

                    detailsText = "";

                }


                return (
                    title.includes(search) ||
                    summary.includes(search) ||
                    module.includes(search) ||
                    detailsText.includes(search)
                );

            });

    }


    /* ---------------------------------------------
       SORT
    --------------------------------------------- */

    const priorityOrder = {

        red:0,
        yellow:1,
        green:2,
        neutral:3

    };


    if(sortBy === "newest"){

        list.sort(
            (a,b) =>
                new Date(b.date) -
                new Date(a.date)
        );

    }


    else if(sortBy === "oldest"){

        list.sort(
            (a,b) =>
                new Date(a.date) -
                new Date(b.date)
        );

    }


    else if(sortBy === "priority"){

        list.sort(
            (a,b) =>
                (
                    priorityOrder[a.tier] ?? 3
                ) -
                (
                    priorityOrder[b.tier] ?? 3
                )
        );

    }


    const container =
        document.getElementById(
            "timelineList"
        );


    /* ---------------------------------------------
       EMPTY STATE
    --------------------------------------------- */

    if(list.length === 0){

        container.innerHTML = `

            <div class="empty-state">

                <div class="icon">
                    📋
                </div>

                <h4>
                    ${
                        databaseLoaded
                            ? "No reports found"
                            : "Loading reports..."
                    }
                </h4>

                <p>
                    ${
                        databaseLoaded
                            ? "Complete a screening to see your report appear here."
                            : "Loading your reports from the database."
                    }
                </p>

            </div>

        `;

        return;

    }


    /* ---------------------------------------------
       REPORT CARDS
    --------------------------------------------- */

    container.innerHTML =
        list.map(r => {

            const mod =
                MODULES[r.module] ||
                {
                    label:"Report",
                    icon:"📄"
                };


            const dateObj =
                new Date(r.date);


            const dateStr =
                isNaN(dateObj.getTime())
                    ? "Date unavailable"
                    : dateObj.toLocaleDateString(
                        undefined,
                        {
                            day:"numeric",
                            month:"short",
                            year:"numeric"
                        }
                    );


            const timeStr =
                isNaN(dateObj.getTime())
                    ? ""
                    : dateObj.toLocaleTimeString(
                        [],
                        {
                            hour:"2-digit",
                            minute:"2-digit"
                        }
                    );


            const tier =
                r.tier || "neutral";


            const tierLabel = {

                green:"Home Monitoring",

                yellow:"Doctor Advised",

                red:"Emergency Flag",

                neutral:"Informational"

            }[tier] || "Informational";


            const safeId =
                String(
                    r.id || ""
                )
                .replace(/\\/g,"\\\\")
                .replace(/'/g,"\\'");


            return `

                <div class="report-item">

                    <div
                        class="report-dot ${escapeHtml(tier)}"
                    ></div>


                    <div
                        class="report-card"
                        onclick="openModal('${safeId}')"
                    >

                        <div class="report-head">

                            <div class="report-title-row">

                                <div class="report-icon">
                                    ${mod.icon}
                                </div>

                                <div>

                                    <div class="report-title">

                                        ${escapeHtml(
                                            r.title ||
                                            mod.label
                                        )}

                                    </div>

                                    <div class="report-date">

                                        ${dateStr}

                                        ${
                                            timeStr
                                                ? " · " + timeStr
                                                : ""
                                        }

                                    </div>

                                </div>

                            </div>


                            <div
                                class="status-pill ${escapeHtml(tier)}"
                            >

                                ● ${tierLabel}

                            </div>

                        </div>


                        <div class="report-summary">

                            ${escapeHtml(
                                r.summary ||
                                "No summary available."
                            )}

                        </div>


                        <div class="report-foot">

                            <span class="module-tag">

                                ${mod.label}

                            </span>


                            <a
                                class="view-link"
                                onclick="event.stopPropagation(); openModal('${safeId}')"
                            >

                                View details →

                            </a>

                        </div>

                    </div>

                </div>

            `;

        }).join("");

}


/* =====================================================
   DETAIL MODAL
===================================================== */

function openModal(id){

    const report =
        allReports.find(
            r =>
                String(r.id) ===
                String(id)
        );


    if(!report){

        return;

    }


    const dateObj =
        new Date(report.date);


    const dateStr =
        isNaN(dateObj.getTime())
            ? "Date unavailable"
            : dateObj.toLocaleDateString(
                undefined,
                {
                    day:"numeric",
                    month:"long",
                    year:"numeric"
                }
            );


    const timeStr =
        isNaN(dateObj.getTime())
            ? ""
            : dateObj.toLocaleTimeString(
                [],
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            );


    document.getElementById(
        "modalTitle"
    ).textContent =
        report.title ||
        "Report";


    document.getElementById(
        "modalDate"
    ).textContent =
        dateStr +
        (
            timeStr
                ? " at " + timeStr
                : ""
        );


    let detailsHtml = "";


    if(
        report.details &&
        typeof report.details === "object"
    ){

        Object.entries(
            report.details
        ).forEach(
            ([label,value]) => {

                detailsHtml += `

                    <div class="modal-detail-row">

                        <span>
                            ${escapeHtml(label)}
                        </span>

                        <b>
                            ${escapeHtml(
                                formatDetailValue(value)
                            )}
                        </b>

                    </div>

                `;

            }
        );

    }


    const mod =
        MODULES[report.module];


    document.getElementById(
        "modalBody"
    ).innerHTML = `

        <p
            style="
                font-size:13.5px;
                color:#475569;
                line-height:1.6;
                margin-bottom:14px;
            "
        >

            ${escapeHtml(
                report.summary ||
                "No summary available."
            )}

        </p>


        ${detailsHtml}


        ${
            mod

                ? `

                    <a
                        href="${mod.page}"
                        style="
                            display:block;
                            text-align:center;
                            margin-top:18px;
                            padding:12px;
                            background:#101b2d;
                            color:white;
                            border-radius:10px;
                            text-decoration:none;
                            font-weight:bold;
                            font-size:14px;
                        "
                    >

                        Open ${escapeHtml(mod.label)} →

                    </a>

                `

                : ""

        }

    `;


    document.getElementById(
        "modalOverlay"
    ).classList.add("show");

}


function closeModal(){

    document.getElementById(
        "modalOverlay"
    ).classList.remove("show");

}


function closeModalOnOverlay(event){

    if(
        event.target.id ===
        "modalOverlay"
    ){

        closeModal();

    }

}


document.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Escape"){

            closeModal();

        }

    }
);


/* =====================================================
   INIT
===================================================== */

loadReportsFromDatabase();

</script>
